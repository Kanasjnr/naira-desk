name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs for pushes
# to staging and main always finish, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # biome ci is read-only and annotates lint errors on the PR diff.
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      # Pinned: the committed fork state below is in this version's cache format.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      # The Taker's tests replay real fills on a Celo fork. Public RPCs don't reliably serve state
      # that old, so the state they read is committed and only block headers come from the RPC.
      - run: |
          mkdir -p ~/.foundry/cache/rpc
          cp -r test/fork-cache/celo ~/.foundry/cache/rpc/
          forge fmt --check
          forge test
        working-directory: packages/contracts
